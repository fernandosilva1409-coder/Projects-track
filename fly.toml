# Fly.io configuration. Change `app` to a unique name before the first deploy
# (or let `fly launch --no-deploy --copy-config` do it for you).
app = "project-tracker-csdb"
primary_region = "mad"

[build]

[env]
  APP_ENV = "production"
  DATA_DIR = "/data"

[mounts]
  source = "tracker_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 14

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
