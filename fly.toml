# fly.toml app configuration file generated for projects-track on 2026-11-25T11:48:00Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'projects-track'
primary_region = 'ams'

[build]
[env]
  APP_ENV = 'production'
  DATA_DIR = '/data'

[[mounts]]
  source = 'tracker_data'
  destination = '/data'
  initial_size = '1gb'
  snapshot_retention = 14

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
