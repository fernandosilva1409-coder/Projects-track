{% extends 'base.html' %}
{% from '_macros.html' import csrf %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><h1>Change password</h1></div>
<div class="panel" style="max-width:420px">
  <form method="post">
    {{ csrf() }}
    <p><label class="lbl" for="current">Current password</label><input id="current" type="password" name="current" required autocomplete="current-password"></p>
    <p><label class="lbl" for="new">New password (min. 8 characters)</label><input id="new" type="password" name="new" required minlength="8" autocomplete="new-password"></p>
    <p><label class="lbl" for="confirm">Repeat new password</label><input id="confirm" type="password" name="confirm" required minlength="8" autocomplete="new-password"></p>
    <button class="primary" type="submit">Change password</button>
  </form>
</div>
{% endblock %}
